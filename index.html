<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="D.A.B.S.y, a living AI desk pet and study companion.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<title>D.A.B.S.y</title>
<style>
:root{--cyan:#00e5ff;--cyan2:#7cf7ff;--white:#fff;--bg:#000;--panel:rgba(10,13,17,.94);--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.62);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{touch-action:none}
button,input,textarea,select{font:inherit}
button{color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#face-stage{position:absolute;inset:0;display:grid;place-items:center;transition:transform .72s var(--ease),filter .5s var(--ease),opacity .4s}
#face{width:min(88vw,500px);height:min(88vh,700px);max-width:500px;max-height:700px;overflow:visible;user-select:none;touch-action:none;transition:transform .45s var(--ease),opacity .35s}
#face-stage.idle #face{animation:float 5s ease-in-out infinite}
#face-stage.listening #face{animation:listen 1.1s ease-in-out infinite}
#face-stage.thinking #face{animation:think 1.25s ease-in-out infinite}
#face-stage.happy #face{animation:happy .75s ease-in-out}
#face-stage.sleeping #face{opacity:.42;transform:scale(.93)}
#face-stage.sad #face{filter:saturate(.55) brightness(.78)}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes listen{50%{transform:scale(1.018)}}
@keyframes think{50%{transform:translateY(-5px) scale(1.012)}}
@keyframes happy{25%{transform:scale(1.04) rotate(-1deg)}50%{transform:scale(1.01) rotate(1deg)}75%{transform:scale(1.04) rotate(-1deg)}}
#eyes{transform-origin:200px 275px;transition:transform .35s var(--ease)}
#bowtie{transform-origin:200px 420px;transition:transform .35s var(--ease)}
#face-stage.peek-left #eyes{transform:translateX(-6px) rotate(-2deg)}
#face-stage.peek-right #eyes{transform:translateX(6px) rotate(2deg)}
#face-stage.excited #eyes{transform:scale(1.05)}
#face-stage.sleeping #eyes{transform:scaleY(.2)}
#face-stage.sleeping #bowtie{opacity:.45}
.eye-hit,#bowtie,#bow-left,#bow-right,#knot,#knot-glint{cursor:pointer}
#subtitle{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(90vw,760px);padding:0 14px;text-align:center;font-size:clamp(15px,3.7vw,26px);font-weight:650;letter-spacing:.01em;text-shadow:0 0 18px rgba(0,229,255,.5),0 2px 20px #000;opacity:0;transition:opacity .22s ease;pointer-events:none;z-index:8}
#subtitle.show{opacity:1}
#status-dot{position:absolute;right:18px;top:18px;width:7px;height:7px;border-radius:50%;background:#333;box-shadow:none;opacity:.5}
#status-dot.online{background:var(--cyan);box-shadow:0 0 14px var(--cyan);opacity:1}
#toast{position:absolute;z-index:90;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(15,18,22,.95);border:1px solid var(--line);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.panel{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,590px);max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 20px 90px rgba(0,0,0,.8),0 0 60px rgba(0,229,255,.08);backdrop-filter:blur(20px);animation:panelIn .3s var(--ease)}
.panel.hidden{display:none!important}
@keyframes panelIn{from{opacity:0;transform:translate(-50%,-47%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.close-btn{position:absolute;right:12px;top:9px;width:40px;height:40px;border:0;background:transparent;border-radius:50%;font-size:29px;opacity:.68;cursor:pointer}
.close-btn:hover{background:rgba(255,255,255,.07);opacity:1}
h2{margin:0 38px 18px 0;font-size:26px}
h3{margin:16px 0 8px}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.row{display:flex;gap:9px;flex-wrap:wrap}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu-item,.action-btn{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:17px;padding:15px;text-align:left;cursor:pointer;transition:.18s}
.menu-item:hover,.action-btn:hover{background:rgba(0,229,255,.09);border-color:rgba(0,229,255,.35);transform:translateY(-1px)}
.menu-item strong{display:block;font-size:15px}.menu-item span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.action-btn{flex:1;min-width:120px;text-align:center}
.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#080a0d;color:#fff;border-radius:13px;padding:12px;outline:none}
.field textarea{min-height:100px;resize:vertical}
.list{display:grid;gap:8px;margin:12px 0}
.list-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
.check{display:flex;gap:9px;align-items:center}
.check input{accent-color:var(--cyan)}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:11px}
#carousel-content{min-height:170px;display:grid;place-items:center;text-align:center}
.carousel-card{width:100%;padding:22px;border-radius:22px;border:1px solid rgba(0,229,255,.18);background:rgba(0,229,255,.045)}
.carousel-icon{font-size:42px;margin-bottom:9px}
.carousel-title{font-size:22px;font-weight:750}.carousel-desc{margin-top:7px;color:var(--muted);line-height:1.5;font-size:13px}
.carousel-hint{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
#carousel-eye-label{text-transform:uppercase;letter-spacing:.16em;color:var(--cyan);font-size:11px}
#projection{position:absolute;inset:0;z-index:15;pointer-events:none}
#projection-card{position:absolute;left:7%;right:7%;top:7%;min-height:155px;border:1px solid rgba(0,229,255,.24);background:rgba(0,0,0,.72);border-radius:24px;padding:20px 22px;box-shadow:0 0 45px rgba(0,229,255,.12);backdrop-filter:blur(12px)}
#projection-title{font-size:12px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
#projection-body{font-size:clamp(20px,5vw,34px);line-height:1.22;font-weight:750;white-space:pre-wrap}
#projection-pointer{position:absolute;width:2px;height:25%;left:50%;bottom:25%;background:linear-gradient(transparent,var(--cyan));filter:drop-shadow(0 0 8px var(--cyan))}
.projection-active #face-stage{transform:translate(28vw,29vh) scale(.36)}
#camera-preview{position:absolute;z-index:40;left:5%;top:6%;width:90%;height:68%;object-fit:cover;border-radius:25px;border:1px solid var(--line);background:#050505}
#install-banner{position:absolute;z-index:100;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,520px);display:none;gap:12px;align-items:center;padding:13px 14px;border:1px solid rgba(0,229,255,.2);background:rgba(9,12,15,.96);border-radius:18px;box-shadow:0 15px 50px rgba(0,0,0,.65)}
#install-banner.show{display:flex}
#install-banner .grow{flex:1}.install-title{font-weight:750}.install-sub{font-size:11px;color:var(--muted);margin-top:3px}
#install-btn{border:0;background:var(--cyan);color:#001014;border-radius:12px;padding:10px 13px;font-weight:800}
#install-close{border:0;background:transparent;font-size:20px}
.pet-meter{height:8px;background:#161a1e;border-radius:99px;overflow:hidden}.pet-meter>i{display:block;height:100%;background:var(--cyan);width:50%;box-shadow:0 0 10px var(--cyan);transition:width .3s}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{padding:12px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:19px}.stat span{color:var(--muted);font-size:11px}
.game-orb{width:150px;height:150px;border-radius:50%;border:1px solid rgba(0,229,255,.35);background:radial-gradient(circle at 35% 30%,#7cf7ff,#00e5ff 30%,#00262b 72%,#000);box-shadow:0 0 45px rgba(0,229,255,.28);display:grid;place-items:center;margin:16px auto;font-weight:900;cursor:pointer}
@media(max-width:430px){.menu-grid{grid-template-columns:1fr}.panel{padding:20px}.projection-active #face-stage{transform:translate(31vw,30vh) scale(.32)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div id="app" aria-label="D.A.B.S.y">
  <div id="face-stage" class="idle">
    <svg id="face" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" aria-label="D.A.B.S.y face">
      <defs>
        <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur2"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="45" result="blur3"/>
          <feMerge><feMergeNode in="blur3"/><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur3"/>
          <feMerge><feMergeNode in="blur3"/><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="eyes" filter="url(#glow-cyan)">
        <rect id="left-eye" class="eye-hit" x="95" y="210" width="85" height="130" rx="38" fill="#00e5ff"/>
        <rect id="right-eye" class="eye-hit" x="220" y="210" width="85" height="130" rx="38" fill="#00e5ff"/>
      </g>
      <g id="glints"><circle cx="120" cy="238" r="11" fill="#fff"/><circle cx="245" cy="238" r="11" fill="#fff"/></g>
      <g id="bowtie" filter="url(#glow-white)">
        <polygon id="bow-left" points="160,411 160,429 110,445 110,395" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
        <polygon id="bow-right" points="240,411 240,429 290,445 290,395" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
        <rect id="knot" x="186" y="408" width="28" height="24" rx="7" fill="#e0f7fa" opacity=".85"/>
      </g>
      <rect id="knot-glint" x="190" y="411" width="8" height="7" rx="2.5" fill="#fff"/>
    </svg>
    <div id="subtitle" aria-live="polite"></div>
    <div id="status-dot" title="D.A.B.S.y status"></div>
    <div id="projection" hidden>
      <div id="projection-pointer"></div>
      <div id="projection-card"><div id="projection-title"></div><div id="projection-body"></div></div>
    </div>
  </div>

  <section id="menu" class="panel hidden" aria-hidden="true">
    <button class="close-btn" data-close>×</button>
    <h2>D.A.B.S.y</h2>
    <p class="small">Double-tap the bow tie for utilities. Double-tap an eye, then swipe to explore its brain.</p>
    <div id="menu-grid" class="menu-grid"></div>
  </section>

  <section id="carousel" class="panel hidden" aria-hidden="true">
    <button class="close-btn" data-close>×</button>
    <div id="carousel-eye-label"></div>
    <div id="carousel-content"></div>
    <div class="carousel-hint">Swipe ← / → to move. Tap the card to open it.</div>
  </section>

  <section id="tool-panel" class="panel hidden" aria-hidden="true">
    <button class="close-btn" data-close>×</button>
    <div id="tool-content"></div>
  </section>

  <div id="toast" role="status"></div>
  <video id="camera-preview" autoplay playsinline muted hidden></video>
  <canvas id="capture-canvas" hidden></canvas>

  <div id="install-banner">
    <div class="grow"><div class="install-title">Install D.A.B.S.y</div><div class="install-sub">Put your little desk companion on the home screen.</div></div>
    <button id="install-btn">Install</button>
    <button id="install-close" aria-label="Dismiss">×</button>
  </div>
</div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const CONFIG = {
  model: "gemini-3.8-flash",
  name: "Swagat"
};

const defaultState = {
  name: CONFIG.name,
  tasks: [],
  reminders: [],
  memory: [],
  stats: {interactions:0, questions:0, tasksDone:0},
  pet: {hunger:72,happiness:78,energy:86,affection:65},
  settings: {geminiKey:"", model:CONFIG.model, voice:true, proactive:true},
  lastOpen: Date.now()
};

let state = loadState();
let toastTimer = null;
let subtitleTimer = null;
let deferredInstall = null;
let carouselIndex = 0;
let carouselSide = "left";
let pointerStart = null;
let lastTap = 0;
let voiceRecognition = null;
let cameraStream = null;
let screenStream = null;

function loadState(){
  try{
    const raw=localStorage.getItem("dabsy-state-v2");
    return raw ? {...structuredClone(defaultState),...JSON.parse(raw)} : structuredClone(defaultState);
  }catch{return structuredClone(defaultState)}
}
function save(){localStorage.setItem("dabsy-state-v2",JSON.stringify(state))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function nowId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

const Face = {
  stage:$("#face-stage"),
  say(text, ms=2600){
    const el=$("#subtitle"); clearTimeout(subtitleTimer);
    el.textContent=text; el.classList.add("show");
    subtitleTimer=setTimeout(()=>el.classList.remove("show"),ms);
  },
  mood(name,duration=1200){
    this.stage.classList.remove("listening","thinking","happy","sleeping","sad","excited","peek-left","peek-right");
    this.stage.classList.add(name);
    if(duration>0)setTimeout(()=>this.stage.classList.remove(name),duration);
  },
  blink(){
    const e=$("#eyes"); e.style.opacity=".12";
    setTimeout(()=>e.style.opacity="1",110);
    setTimeout(()=>{e.style.opacity=".12"},190);
    setTimeout(()=>{e.style.opacity="1"},300);
  },
  petReaction(){
    this.mood("happy",700); this.say("heh… that tickles 🐾",1600);
  }
};

const Store = {
  addTask(text){state.tasks.unshift({id:nowId(),text,done:false,created:Date.now()});save();},
  toggleTask(id){
    const t=state.tasks.find(x=>x.id===id); if(!t)return;
    t.done=!t.done; if(t.done)state.stats.tasksDone++;
    save();
  },
  addReminder(text,when){state.reminders.push({id:nowId(),text,when,done:false});state.reminders.sort((a,b)=>a.when-b.when);save()},
  remember(text){if(text.trim())state.memory.unshift({id:nowId(),text:text.trim(),at:Date.now()});state.memory=state.memory.slice(0,50);save()},
  pet(delta){
    for(const k of Object.keys(delta))state.pet[k]=Math.max(0,Math.min(100,state.pet[k]+delta[k]));
    save();
  },
  stat(k){state.stats[k]=(state.stats[k]||0)+1;save()}
};

function toast(text){
  const el=$("#toast"); clearTimeout(toastTimer);
  el.textContent=text; el.classList.add("show");
  toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}

function openPanel(id){
  $$(".panel").forEach(p=>p.classList.add("hidden"));
  const p=$(id); p.classList.remove("hidden"); p.setAttribute("aria-hidden","false");
}
function closePanels(){
  $$(".panel").forEach(p=>{p.classList.add("hidden");p.setAttribute("aria-hidden","true")});
  stopCamera(); stopScreen();
  $("#projection").hidden=true; $("#app").classList.remove("projection-active");
}
function menu(){
  const items=[
    ["🧠","Ask D.A.B.S.y","AI, study help, explanations","ask"],
    ["👀","Vision","Camera + screen understanding","vision"],
    ["📋","Tasks","Homework and to-dos","tasks"],
    ["⏰","Reminders","Time-based nudges","reminders"],
    ["📅","Planner","Today and quick planning","planner"],
    ["🐾","Pet","Mood, care and affection","pet"],
    ["🎮","Play","Mini game","game"],
    ["✨","Tricks","Little face tricks","tricks"],
    ["🎤","Voice","Talk using your microphone","voice"],
    ["🧠","Memory","Remember or forget things","memory"],
    ["⚙️","Settings","Name, AI key, controls","settings"],
    ["📲","Install","Install D.A.B.S.y as an app","install"]
  ];
  $("#menu-grid").innerHTML=items.map(([i,t,d,a])=>`<button class="menu-item" data-tool="${a}"><strong>${i} ${t}</strong><span>${d}</span></button>`).join("");
  openPanel("#menu");
}

const CARDS = {
  left:[
    {icon:"🧠",title:"Study brain",desc:"Ask questions, explain concepts, solve problems step by step.",tool:"ask"},
    {icon:"👀",title:"See this",desc:"Share your camera or screen and let D.A.B.S.y understand it.",tool:"vision"},
    {icon:"📚",title:"Study mode",desc:"Turn a question into a clear projected explanation.",tool:"ask"},
    {icon:"📝",title:"Remember",desc:"Save a fact or preference locally on this device.",tool:"memory"}
  ],
  right:[
    {icon:"🎮",title:"Play",desc:"A tiny reflex game lives inside D.A.B.S.y.",tool:"game"},
    {icon:"✨",title:"Trick",desc:"Make the face blink, peek and react.",tool:"tricks"},
    {icon:"🐾",title:"Pet mode",desc:"Rub, pat and care for your little companion.",tool:"pet"},
    {icon:"🎵",title:"Vibe",desc:"Let D.A.B.S.y react to the mood of your music.",tool:"vibe"}
  ]
};

function renderCarousel(){
  const arr=CARDS[carouselSide], item=arr[carouselIndex%arr.length];
  $("#carousel-eye-label").textContent=carouselSide+" eye";
  $("#carousel-content").innerHTML=`<button class="carousel-card" data-tool="${item.tool}">
    <div class="carousel-icon">${item.icon}</div>
    <div class="carousel-title">${item.title}</div>
    <div class="carousel-desc">${item.desc}</div>
  </button>`;
}
function openCarousel(side){
  carouselSide=side; carouselIndex=0; renderCarousel(); openPanel("#carousel");
}

async function gemini(prompt,imageData){
  const key=state.settings.geminiKey.trim();
  if(!key) throw new Error("Add your Gemini API key in Settings first.");
  const model=(state.settings.model||CONFIG.model).trim();
  const parts=[{text:prompt}];
  if(imageData)parts.push({inlineData:{mimeType:"image/jpeg",data:imageData.split(",")[1]}});
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const body={contents:[{role:"user",parts}],generationConfig:{responseMimeType:"text/plain"}};
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok)throw new Error(data?.error?.message||"Gemini request failed.");
  const text=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("").trim();
  if(!text)throw new Error("D.A.B.S.y received no answer.");
  return text;
}

function speak(text){
  if(!state.settings.voice || !("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[*#`]/g,""));
  u.rate=.98; u.pitch=1.08; u.volume=.9; u.lang="en-IN";
  speechSynthesis.speak(u);
}

function project(title,body,duration=10000){
  $("#projection-title").textContent=title;
  $("#projection-body").textContent=body;
  $("#projection").hidden=false;
  $("#app").classList.add("projection-active");
  clearTimeout(project.timer);
  project.timer=setTimeout(()=>{$("#projection").hidden=true;$("#app").classList.remove("projection-active")},duration);
}

async function askTool(){
  openPanel("#tool-panel");
  $("#tool-content").innerHTML=`<h2>🧠 Ask D.A.B.S.y</h2>
    <p class="small">Type a question. If you want it projected like a little desk display, turn on Projection.</p>
    <div class="field"><textarea id="ask-input" placeholder="What do you want to know?"></textarea></div>
    <div class="row"><button class="action-btn" id="ask-send">Ask</button><button class="action-btn" id="ask-voice">🎤 Voice</button></div>
    <div class="field"><label><input id="ask-project" type="checkbox" checked> Project the answer</label></div>
    <div id="ask-result"></div>`;
  $("#ask-send").onclick=()=>runAsk($("#ask-input").value.trim(),$("#ask-project").checked);
  $("#ask-input").onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))runAsk(e.target.value.trim(),$("#ask-project").checked)};
  $("#ask-voice").onclick=startVoice;
  $("#ask-input").focus();
}
async function runAsk(q,projection=true,image=null){
  if(!q && !image){toast("Give me something to think about.");return}
  closePanels(); state.stats.questions++; save(); Face.mood("thinking",0); Face.say("Thinking…",1800);
  try{
    const prompt=image ? q : `You are D.A.B.S.y, a friendly desk companion for a student. Answer clearly and helpfully. If this is a study question, teach the concept and show steps rather than only giving a final answer. Keep the answer reasonably concise.`;
    const answer=await gemini(prompt,image);
    Face.mood("happy",900);
    Face.say(answer.length>180?answer.slice(0,180)+"…":answer,4200);
    speak(answer);
    if(projection)project("D.A.B.S.y",answer);
    state.stats.questions++;
    save();
  }catch(e){
    Face.mood("sad",900); Face.say("My brain connection needs a little setup.",2600); toast(e.message);
  }
}

function visionTool(){
  openPanel("#tool-panel");
  $("#tool-content").innerHTML=`<h2>👀 Vision</h2>
  <p class="small">Nothing is shared until you explicitly start camera or screen capture. D.A.B.S.y can analyze a still image with your configured Gemini key.</p>
  <div class="row"><button class="action-btn" id="cam-start">📷 Camera</button><button class="action-btn" id="screen-start">🖥️ Screen</button></div>
  <div class="row"><button class="action-btn" id="cam-analyze">🔍 Analyze camera</button><button class="action-btn" id="cam-stop">Stop</button></div>`;
  $("#cam-start").onclick=async()=>{try{await startCamera();toast("Camera is on. Frame what you want D.A.B.S.y to see.")}catch(e){toast(e.message)}};
  $("#cam-analyze").onclick=async()=>{try{const img=snapshot();stopCamera();await runAsk("Look carefully at this image. Identify important objects, text, diagrams or a study question. Explain what matters.",true,img)}catch(e){toast(e.message)}};
  $("#cam-stop").onclick=()=>{stopCamera();stopScreen()};
  $("#screen-start").onclick=async()=>{try{const img=await captureScreen();await runAsk("Look carefully at this screen capture. Explain what is visible and identify important text, objects, diagrams or a study problem.",true,img)}catch(e){toast(e.message)}};
}
async function startCamera(){
  stopScreen();
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera access is not supported here.");
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  const v=$("#camera-preview");v.srcObject=cameraStream;v.hidden=false;
}
function stopCamera(){
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
  $("#camera-preview").hidden=true;$("#camera-preview").srcObject=null;
}
function snapshot(){
  const v=$("#camera-preview"),c=$("#capture-canvas");
  if(!cameraStream||!v.videoWidth)throw new Error("Start the camera first.");
  c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  return c.toDataURL("image/jpeg",.82);
}
async function captureScreen(){
  if(!navigator.mediaDevices?.getDisplayMedia)throw new Error("Screen capture is not supported here.");
  screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
  const track=screenStream.getVideoTracks()[0];
  const v=document.createElement("video");v.srcObject=screenStream;v.muted=true;await v.play();
  await new Promise(r=>setTimeout(r,300));
  const c=$("#capture-canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  screenStream.getTracks().forEach(t=>t.stop());screenStream=null;
  return c.toDataURL("image/jpeg",.82);
}
function stopScreen(){if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null}}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Speech recognition is not supported by this browser.");return}
  if(voiceRecognition){voiceRecognition.stop();return}
  voiceRecognition=new SR();voiceRecognition.lang="en-IN";voiceRecognition.interimResults=false;voiceRecognition.maxAlternatives=1;
  Face.mood("listening",0);Face.say("I'm listening…",1800);
  voiceRecognition.onresult=e=>{const text=e.results[0][0].transcript;closePanels();Face.say("You said: "+text,1800);runAsk(text,true)};
  voiceRecognition.onerror=e=>toast("Voice: "+e.error);
  voiceRecognition.onend=()=>{voiceRecognition=null;Face.stage.classList.remove("listening")};
  try{voiceRecognition.start()}catch(e){toast(e.message)}
}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){closePanels();return}
  const item=e.target.closest("[data-tool]");
  if(item){const fn=toolMap[item.dataset.tool];if(fn)fn()}
  const card=e.target.closest(".carousel-card"); if(card){const fn=toolMap[card.dataset.tool];if(fn){closePanels();fn()}}
});

document.addEventListener("pointerdown",e=>{
  pointerStart={x:e.clientX,y:e.clientY,t:Date.now(),target:e.target};
  const n=Date.now();
  if(n-lastTap<330){
    lastTap=0;
    if(e.target.closest("#bowtie")||["knot","bow-left","bow-right","knot-glint"].includes(e.target.id)){closePanels();menu()}
    else if(e.target.closest(".eye-hit")){openCarousel(e.target.id==="left-eye"?"left":"right")}
  }else lastTap=n;
});
document.addEventListener("pointerup",e=>{
  if(!pointerStart)return;
  const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y,dt=Date.now()-pointerStart.t;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)&&!$("#carousel").classList.contains("hidden")){
    const len=CARDS[carouselSide].length;carouselIndex=(carouselIndex+(dx<0?1:-1)+len)%len;renderCarousel();pointerStart=null;return
  }
  if(dt>600&&pointerStart.target.closest(".eye-hit")){Store.pet({happiness:5,affection:7,energy:-1});Face.petReaction()}
  pointerStart=null;
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closePanels();
  if(e.key===" " && !e.target.matches("input,textarea,button")){Face.blink()}
});

function remindersTick(){
  const due=state.reminders.filter(r=>!r.done&&r.when<=Date.now());
  for(const r of due){
    r.done=true;save();Face.mood("happy",900);Face.say("⏰ "+r.text,4200);speak(r.text);
  }
}
setInterval(remindersTick,15000);
setInterval(()=>{
  state.pet.hunger=Math.max(0,state.pet.hunger-.5);
  state.pet.energy=Math.max(0,state.pet.energy-.2);
  state.pet.happiness=Math.max(0,state.pet.happiness-.15);
  save();
},60000);

let idleTimer=null;
function idleReaction(){
  if(!state.settings.proactive)return;
  const choices=[()=>Face.blink(),()=>{Face.stage.classList.add("peek-left");setTimeout(()=>Face.stage.classList.remove("peek-left"),700)},()=>{Face.stage.classList.add("peek-right");setTimeout(()=>Face.stage.classList.remove("peek-right"),700)}];
  choices[Math.floor(Math.random()*choices.length)]();
}
function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(idleReaction,12000+Math.random()*12000)}
["pointerdown","pointermove","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

window.addEventListener("online",()=>$("#status-dot").classList.add("online"));
window.addEventListener("offline",()=>$("#status-dot").classList.remove("online"));
if(navigator.onLine)$("#status-dot").classList.add("online");

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredInstall=e;$("#install-banner").classList.add("show");
});
$("#install-btn").onclick=installTool;
$("#install-close").onclick=()=>$("#install-banner").classList.remove("show");

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});
}

Store.stat("interactions");
Face.say(`Hello ${state.name} 👋`,2600);
resetIdle();
</script>
